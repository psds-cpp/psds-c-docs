name: Compile

on:
  workflow_call: {}
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Compile PDF files
      run: |
        nix build

    - name: Upload PDF files
      uses: actions/upload-artifact@v4
      with:
        name: pdf
        path: result/